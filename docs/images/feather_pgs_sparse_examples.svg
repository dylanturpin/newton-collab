<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
  <title id="title">Why real scenes benefit differently from sparse FPGS</title>
  <desc id="desc">Topological schematics and measured whole-PR results for G1 flat, KukaAllegro with a free object, ANYmal-D flat and rough, and Cassie flat. Highlighted paths show contact support, not the only bodies that can move. G1 benefits from a large branching tree and compact rows; Kuka retains its shared arm and physical object response; ANYmal has identical topology but different full-step work on rough terrain; Cassie benefits even with full-width maximum support. Allegro's native velocity limits currently select the original path. All gains compare fpgs-main 5238407d with measured solver a25b4c45 on RTX PRO6000 at 16,384 worlds, graphs on and video off.</desc>
