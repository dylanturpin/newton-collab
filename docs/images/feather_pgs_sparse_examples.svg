  <rect x="57" y="62" width="46" height="24" rx="7" fill="#304d70"/>
  <circle cx="80" cy="0" r="12" fill="#d7e0e8"/>
  <path d="M8 165 H39 M121 165 H145 M-4 185 H160" fill="none" stroke="#d7e0e8" stroke-width="4"/>
