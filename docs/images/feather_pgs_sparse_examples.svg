  <circle cx="19" cy="165" r="5" fill="#c56c30" stroke="#fff" stroke-width="1"/>
  <text x="25" y="210" class="small" >foot contact</text>
</g>
  <text x="277" y="284" class="body" >43 response DOFs</text>
  <text x="277" y="317" class="body" >Foot path: 6 base + 6 leg</text>
  <text x="277" y="350" class="body" >Maximum row width: 18 / 43</text>
  <text x="277" y="383" class="body" >434 packed factor entries</text>
  <text x="64" y="488" class="body" >Skip unrelated branches in the contact row,</text>
  <text x="64" y="514" class="body" >but keep the root that couples all limbs.</text>
  <rect x="64" y="530" width="488" height="44" rx="8" fill="#e7f4f1"/>
  <text x="81" y="559" class="gain" >1.61× physics</text>
  <text x="337" y="559" class="gain" >1.42× env FPS</text>

  <rect x="620" y="166" width="540" height="420" rx="16" class="card"/>
  <text x="644" y="196" class="eyebrow" >SHARED ARM · BRANCHING FINGERS · FREE OBJECT</text>
  <text x="644" y="235" class="head" >KukaAllegro lift</text>
  <g transform="translate(642 262)">
  <rect x="15" y="162" width="62" height="13" rx="4" fill="#304d70"/>
  <polyline points="45,157 45,126 75,108 75,75 108,53 135,64 143,86" fill="none" stroke="#087f83" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="45" cy="157" r="4" fill="#087f83" stroke="#fff" stroke-width="1"/><circle cx="45" cy="126" r="4" fill="#087f83" stroke="#fff" stroke-width="1"/><circle cx="75" cy="108" r="4" fill="#087f83" stroke="#fff" stroke-width="1"/><circle cx="75" cy="75" r="4" fill="#087f83" stroke="#fff" stroke-width="1"/><circle cx="108" cy="53" r="4" fill="#087f83" stroke="#fff" stroke-width="1"/><circle cx="135" cy="64" r="4" fill="#087f83" stroke="#fff" stroke-width="1"/><circle cx="143" cy="86" r="4" fill="#087f83" stroke="#fff" stroke-width="1"/>
