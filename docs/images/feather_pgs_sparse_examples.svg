    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #172b42; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: -.6px; }
      .head { font-size: 27px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; fill: #526579; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #087f83; }
      .gain { font-size: 22px; font-weight: 700; fill: #126862; }
      .muted { fill: #526579; }
      .card { fill:#fff; stroke:#d5dee7; stroke-width:1.5; }
    </style>
    <marker id="force" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#c56c30" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1200" height="1320" rx="20" fill="#fff"/>
  <text x="40" y="40" class="eyebrow" >SAME PR · DIFFERENT TOPOLOGY, CONTACTS AND TOTAL WORK</text>
  <text x="40" y="85" class="title" >Where the savings appear — and where they do not.</text>
  <text x="40" y="116" class="body" fill="#526579">RTX PRO6000 · 16,384 environments · CUDA graphs on · video off</text>
  <circle cx="47" cy="141" r="5" fill="#087f83"/><text x="61" y="147" class="small" >contact ancestry</text>
  <circle cx="249" cy="141" r="5" fill="#304d70"/><text x="263" y="147" class="small" >shared base</text>
  <circle cx="420" cy="141" r="5" fill="#c56c30"/><text x="434" y="147" class="small" >contact / free object</text>
  <text x="692" y="147" class="small" >Schematics, not physical proportions or full joint drawings.</text>

  <rect x="40" y="166" width="540" height="420" rx="16" class="card"/>
  <text x="64" y="196" class="eyebrow" >MANY BRANCHES · COMPACT CONTACT SUPPORT</text>
  <text x="64" y="235" class="head" >G1 flat</text>
  <g transform="translate(76 262)">
  <polyline points="80,10 80,35 80,75" fill="none" stroke="#d7e0e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="10" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="80" cy="35" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="80" cy="75" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/>
  <polyline points="80,35 45,35 18,57 5,80" fill="none" stroke="#d7e0e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="35" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="45" cy="35" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="18" cy="57" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="5" cy="80" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/>
  <polyline points="80,35 115,35 142,57 155,80" fill="none" stroke="#d7e0e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="35" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="115" cy="35" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="142" cy="57" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="155" cy="80" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/>
  <polyline points="80,75 112,102 121,137 132,161" fill="none" stroke="#d7e0e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="75" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="112" cy="102" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="121" cy="137" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/><circle cx="132" cy="161" r="4" fill="#d7e0e8" stroke="#fff" stroke-width="1"/>
